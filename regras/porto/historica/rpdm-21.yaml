id: rpdm-21
diploma: RPDM do Porto — Regulamento (pdm.cm-porto.pt/documents/121)
norma: "Artigo 21.º"
categoria: historica
tema: demolicoes
texto: >
  Só se admitem demolições, totais ou parciais, quando a recuperação é tecnicamente
  inviável e: a) por razões de segurança de pessoas e bens; b) quando o edifício
  constitua intrusão arquitetónica ou urbanística de má qualidade e desqualificadora.
computabilidade: apreciacao
entradas: [carta_patrimonio]
