texto: >
  As áreas históricas correspondem aos tecidos consolidados mais antigos da cidade e às
  reminiscências dos núcleos rurais primitivos que ainda conservam a estrutura e os
  elementos morfológicos iniciais (Centro Histórico do Porto, Foz Velha e núcleos
  identificados na Carta de Património I). Pretende-se a preservação e requalificação
  do edificado e dos espaços livres.
