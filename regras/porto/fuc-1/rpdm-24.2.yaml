id: rpdm-24.2
diploma: RPDM (2.ª alteração, Abril 2025)
norma: "Artigo 24.º, n.º 2"
categoria: frente_urbana_continua_tipo_I
tema: ampliacao_com_preservacao
texto: >
  Sem prejuízo do disposto no número anterior, admitem-se ainda obras de
  ampliação dos edifícios existentes desde que sejam conservados todos os
  elementos arquitetónicos e construtivos que contribuam para a
  caracterização patrimonial do edifício e da imagem urbana desta zona da
  cidade, salvaguardando a harmonia das proporções entre a ampliação e a
  construção pré-existente.
computabilidade: apreciacao
entradas: []
efeito: >
  Relevante quando existe edifício na parcela: a via da ampliação depende
  de juízo patrimonial. Reportar como "carece de análise".
papel_no_intervalo: nota
