id: rpdm-24.1.a
diploma: RPDM (2.ª alteração, Abril 2025)
norma: "Artigo 24.º, n.º 1, alínea a)"
categoria: frente_urbana_continua_tipo_I
tema: alinhamento_frontal
texto: >
  Cumprimento dos alinhamentos e do tipo de relação do edifício com o
  espaço público dominante na frente urbana em que a parcela se integra,
  exceto nas situações em que já se tenham estabelecido ou se venham a
  estabelecer novos alinhamentos, devidamente justificados.
parametros:
  referencia: alinhamento_dominante_da_frente_urbana
computabilidade: semi
entradas: [edificado_frente_urbana]
efeito: >
  Fixa o plano frontal do envelope pelo alinhamento dominante derivado das
  fachadas existentes. Novos alinhamentos estabelecidos pela CMP não são
  conhecíveis pela ferramenta: declarar como pressuposto na ficha.
papel_no_intervalo: base
