id: rpdm-30.1.a
diploma: RPDM (2.ª alteração, Abril 2025)
norma: "Artigo 30.º, n.º 1, alínea a)"
categoria: edificios_tipo_moradia
tema: alinhamento_frontal
texto: >
  Cumprimento do alinhamento frontal da frente urbana respetiva, quer para
  os edifícios, quer para as frentes da parcela confinantes com o espaço
  público, exceto nas situações em que já se tenham estabelecido ou se
  venham a estabelecer novos alinhamentos.
parametros:
  referencia: alinhamento_frontal_da_frente_urbana
computabilidade: semi
entradas: [edificado_frente_urbana]
efeito: >
  Fixa o plano frontal do envelope pelo alinhamento existente. Novos
  alinhamentos estabelecidos pela CMP não são conhecíveis: declarar como
  pressuposto. Ver excepção das parcelas > 2000 m² [rpdm-30.2].
papel_no_intervalo: base
