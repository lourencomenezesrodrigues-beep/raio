<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAIO — pesquisa de terreno</title>
<link rel="icon" href="/web/brand/raio-4a-favicon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<style>
  :root{
    --ink:#16161A; --vermelhao:#F03C2E; --paper:#F7F6F3;
    --line:rgba(22,22,26,.16); --line-strong:rgba(22,22,26,.30); --muted:rgba(22,22,26,.60);
    --verm-soft:rgba(240,60,46,.07);
    --archivo:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;font-family:var(--mono);color:var(--ink);background:var(--paper)}
  #painel{width:372px;flex:none;height:100%;overflow-y:auto;border-right:1px solid var(--ink);
    background:var(--paper);display:flex;flex-direction:column}
  #mapa{flex:1;height:100%}

  .cab{padding:20px 20px 14px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px}
  .cab svg{width:34px;height:34px;flex:none}
  .cab .hbase{fill:none;stroke:var(--ink);stroke-width:9;opacity:.14;stroke-linejoin:miter}
  .cab .hseg{fill:none;stroke:var(--vermelhao);stroke-width:9;stroke-linejoin:miter}
  body.calculating .cab .hseg{stroke-dasharray:48 272;animation:march 1.4s linear infinite}
  @media (prefers-reduced-motion:reduce){
    body.calculating .cab .hseg{animation:pulse 1.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  }
  .cab .wm{font-family:var(--archivo);font-weight:900;font-size:24px;letter-spacing:-.03em;
    line-height:1;text-transform:uppercase}
  .cab .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin-top:3px}

  form{display:flex;gap:0;padding:16px 20px}
  input{flex:1;font-family:var(--mono);font-size:13px;padding:11px 12px;border:1px solid var(--ink);
    border-right:none;background:var(--paper);color:var(--ink)}
  input::placeholder{color:var(--muted)}
  input:focus{outline:none}
  button{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:11px 15px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    transition:background .16s cubic-bezier(.23,1,.32,1)}
  button:hover{background:var(--vermelhao);border-color:var(--vermelhao)}
  button:active{transform:scale(.98)}

  .cands{padding:0 20px}
  .cand{padding:10px 11px;border:1px solid var(--line);margin-bottom:7px;cursor:pointer;font-size:12.5px}
  .cand:hover{border-color:var(--ink)}
  .cand .t{font-family:var(--archivo);font-weight:600;text-transform:uppercase;letter-spacing:.01em}
  .cand .c{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}

  #res{padding:18px 20px;flex:1}
  .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .cat{font-family:var(--archivo);font-weight:800;text-transform:uppercase;font-size:19px;
    letter-spacing:-.01em;margin:6px 0 2px;line-height:1.1}
  .cod{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 9px;margin-top:10px;border:1px solid var(--ink)}
  .badge.no{color:var(--muted);border-color:var(--line-strong)}
  .sec{margin-top:22px}
  .sec>.k{margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .cond{border:1px solid var(--line);border-left:3px solid var(--line-strong);padding:10px 12px;
    margin-bottom:8px;font-size:12.5px}
  .cond.warn{border-left-color:var(--vermelhao);background:var(--verm-soft)}
  .cond .l{font-family:var(--archivo);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.01em}
  .cond .d{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.5}
  .muted{color:var(--muted);font-size:12.5px;line-height:1.6}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .abc{font-family:var(--mono);font-weight:500;font-size:27px;letter-spacing:-.01em;margin:3px 0;
    font-variant-numeric:tabular-nums}
  .abc .u{font-size:12px;color:var(--muted)}
  .spec{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.03em}
  .mun{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
  .ficha-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:20px;
    background:var(--ink);color:var(--paper);border:1px solid var(--ink);text-decoration:none;padding:13px;
    font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    transition:background .16s cubic-bezier(.23,1,.32,1)}
  .ficha-btn:hover{background:var(--vermelhao);border-color:var(--vermelhao)}
  .hint{padding:18px 20px;color:var(--muted);font-size:12.5px;line-height:1.6}
  .fx-form{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .fx{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .fx input[type=number]{font-family:var(--mono);font-size:13px;padding:8px 10px;
    border:1px solid var(--line-strong);background:var(--paper);color:var(--ink)}
  .fx input:focus{outline:none;border-color:var(--ink)}
  .fx.cbx{flex-direction:row;align-items:center;gap:9px;cursor:pointer}
  .fx.cbx input{accent-color:var(--vermelhao);width:15px;height:15px}
  .fx-hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin-top:8px}

  /* loader "A CALCULAR" — o traço percorre o limite da parcela */
  .loader{display:flex;align-items:center;gap:14px;padding:4px 0}
  .loader svg{width:46px;height:46px;flex:none}
  .loader .lbase{fill:none;stroke:var(--ink);stroke-width:9;opacity:.16;stroke-linejoin:miter}
  .loader .lseg{fill:none;stroke:var(--vermelhao);stroke-width:9;stroke-linejoin:miter;
    stroke-dasharray:48 272;animation:march 1.4s linear infinite}
  .loader-txt{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  @keyframes march{to{stroke-dashoffset:-320}}
  @media (prefers-reduced-motion:reduce){
    .loader .lseg{animation:pulse 1.4s ease-in-out infinite;stroke-dasharray:320;stroke-dashoffset:0}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  }

  /* Leaflet: sem cantos, tinta da marca */
  .leaflet-container{background:#e9e8e4;font-family:var(--mono)}
  .leaflet-bar a,.leaflet-control-layers,.leaflet-draw-toolbar a{border-radius:0!important}
  .leaflet-control-layers{font-size:11px;border:1px solid var(--ink)!important}
  .leaflet-bar{border:1px solid var(--ink)!important}
</style>
</head>
<body>
  <div id="painel">
    <div class="cab">
      <svg class="hdr" viewBox="0 0 100 100" aria-label="RAIO">
        <path class="hbase" d="M16,88 V40 H32 V24 H48 V16 H80 V48 H64 V64 H88 V88 Z"></path>
        <path class="hseg" d="M16,88 V40 H32 V24 H48 V16 H80 V48 H64 V64 H88 V88 Z"></path>
      </svg>
      <div>
        <div class="wm">RAIO</div>
        <div class="sub">Pesquisa de terreno · <a href="/tutorial" style="color:var(--vermelhao);text-decoration:none">Tutorial</a></div>
      </div>
    </div>
    <form id="busca">
      <input id="q" placeholder="Morada (ex.: Rua de Santa Catarina 200)" autocomplete="off">
      <button type="submit">Ir</button>
    </form>
    <div class="cands" id="cands"></div>
    <div id="res"><div class="hint">Pesquise uma morada ou clique no mapa para ver a
      categoria de solo e as condicionantes de um ponto.</div></div>
  </div>
  <div id="mapa"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
const PDM = "https://fedservergeo.cm-porto.pt/arcgis/rest/services/PDM2021";

const map = L.map("mapa", {zoomControl:true}).setView([41.1496,-8.6109], 14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
// Camadas do PDM da CMP (reprojectam no export, ao contrário da base cache).
const qualif = L.esri.dynamicMapLayer({url:`${PDM}/PO1A_QS/MapServer`, layers:[8], opacity:0.5}).addTo(map);
const cond = L.esri.dynamicMapLayer({url:`${PDM}/CCGD_PUBLICACAO/MapServer`, opacity:0.6});
L.control.layers({},
  {"Qualificação do solo":qualif, "Condicionantes":cond},
  {collapsed:false}).addTo(map);

// desenho do terreno -> capacidade
const drawn = new L.FeatureGroup().addTo(map);
map.addControl(new L.Control.Draw({
  position:"topleft",
  draw:{polygon:{shapeOptions:{color:"#F03C2E",weight:3,fillColor:"#F03C2E",fillOpacity:.1}},
        polyline:false, rectangle:false, circle:false, marker:false, circlemarker:false},
  edit:{featureGroup:drawn}
}));
map.on(L.Draw.Event.CREATED, e=>{
  drawn.clearLayers(); drawn.addLayer(e.layer);
  if(marca){ map.removeLayer(marca); marca=null; }
  const ll = e.layer.getLatLngs()[0].map(p=>[p.lat,p.lng]);
  analisarParcela(ll, {});
});
// enquanto se desenha (e logo a seguir), o clique de fecho não deve disparar
// uma análise de ponto que sobrepõe a da parcela.
let desenhando = false;
map.on(L.Draw.Event.DRAWSTART, ()=>{ desenhando = true; });
map.on(L.Draw.Event.DRAWSTOP, ()=>{ setTimeout(()=>{ desenhando = false; }, 350); });
let ultimoLatlngs = null, ultimoExtra = {};

let marca = null;
function ponto(lat, lon){
  if(marca) marca.setLatLng([lat,lon]);
  else marca = L.circleMarker([lat,lon],{radius:6,color:"#F03C2E",weight:3,
    fillColor:"#F03C2E",fillOpacity:.9}).addTo(map);
  drawn.clearLayers();
  analisarPonto(lat, lon);
}
map.on("click", e => { if(desenhando) return; ponto(e.latlng.lat, e.latlng.lng); });

document.getElementById("busca").addEventListener("submit", async e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  const cds = document.getElementById("cands");
  if(!q){ cds.innerHTML=""; return; }
  cds.innerHTML = '<div class="muted" style="padding:0 0 8px">A procurar…</div>';
  try{
    const r = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
    const {candidatos} = await r.json();
    if(!candidatos.length){ cds.innerHTML='<div class="muted" style="padding:0 0 10px">Sem resultados no Porto.</div>'; return; }
    cds.innerHTML = candidatos.map((c,i)=>
      `<div class="cand" data-i="${i}"><div class="t">${(c.label||"").split(",")[0]}</div>
       <div class="c">${c.x.toFixed(0)}, ${c.y.toFixed(0)} · ${(c.label||"").slice(0,60)}</div></div>`).join("");
    [...cds.querySelectorAll(".cand")].forEach(el=>el.onclick=()=>{
      const c = candidatos[+el.dataset.i];
      map.setView([c.lat,c.lon], 17); ponto(c.lat, c.lon); cds.innerHTML="";
    });
  }catch(err){ cds.innerHTML=`<div class="muted">Erro: ${err}</div>`; }
});

const res = () => document.getElementById("res");
const fmt = v => (v==null?"—":(Number.isInteger(v)?v:(+v).toFixed(1)));
const SYMPATH = "M16,88 V40 H32 V24 H48 V16 H80 V48 H64 V64 H88 V88 Z";
const loaderHTML = txt => `<div class="loader"><svg viewBox="0 0 100 100">
  <path class="lbase" d="${SYMPATH}"></path><path class="lseg" d="${SYMPATH}"></path></svg>
  <div class="loader-txt">${txt}</div></div>`;

async function analisarPonto(lat, lon){
  res().innerHTML = loaderHTML('A ler o cadastro');
  document.body.classList.add("calculating");
  try{
    const r = await fetch(`/api/analisar?lat=${lat}&lon=${lon}`);
    const d = await r.json();
    if(d.erro){ res().innerHTML=`<div class="muted">Erro: ${d.erro}</div>`; return; }
    render(d, `/api/ficha?lat=${lat}&lon=${lon}`);
  }catch(err){ res().innerHTML=`<div class="muted">Erro: ${err}</div>`; }
  finally{ document.body.classList.remove("calculating"); }
}

async function analisarParcela(latlngs, extra){
  ultimoLatlngs = latlngs; ultimoExtra = extra || {};
  res().innerHTML = loaderHTML('A calcular a capacidade');
  document.body.classList.add("calculating");
  try{
    const r = await fetch("/api/parcela", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({coords:latlngs, extra:ultimoExtra})});
    const d = await r.json();
    if(d.erro){ res().innerHTML=`<div class="muted">Erro: ${d.erro}</div>`; return; }
    const poly = latlngs.map(p=>`${p[0]},${p[1]}`).join(";");
    const q = new URLSearchParams({poly});
    for(const [k,v] of Object.entries(ultimoExtra)) q.set(k, v===true?"1":v);
    render(d, `/api/ficha?${q.toString()}`, true);
  }catch(err){ res().innerHTML=`<div class="muted">Erro: ${err}</div>`; }
  finally{ document.body.classList.remove("calculating"); }
}

const num = (n,l,ph)=>`<label class="fx"><span>${l}</span>
  <input type="number" step="0.5" min="0" data-k="${n}" placeholder="${ph||''}"
   value="${ultimoExtra[n]!=null?ultimoExtra[n]:''}"></label>`;
const chk = (n,l)=>`<label class="fx cbx"><input type="checkbox" data-k="${n}"
   ${ultimoExtra[n]?'checked':''}><span>${l}</span></label>`;

function formHTML(slug){
  let campos = "";
  if(slug && slug.indexOf("frente_urbana")===0){
    campos = num("largura_arruamento_m","Largura do arruamento","m")
           + num("moda_cercea_m","Moda da cércea (sobrepor)","m")
           + num("empena_confinante_m","Empena confinante","m")
           + chk("uso_habitacao_coletiva","Habitação coletiva")
           + chk("gaveto","Parcela de gaveto");
  } else if(slug==="edificios_tipo_moradia"){
    campos = num("moda_cercea_m","Moda da cércea (colmatação)","m")
           + chk("colmatacao_consolidado","Colmatação de conjunto consolidado")
           + chk("uopg","Em UOPG");
  } else { return ""; }
  return `<div class="sec"><div class="k">Parâmetros (não automáticos)</div>
    <form id="fx-form" class="fx-form">${campos}</form>
    <div class="fx-hint">Preenche o que souberes — recalcula automaticamente.</div></div>`;
}

function aplicarExtra(){
  const extra = {};
  document.querySelectorAll('#fx-form [data-k]').forEach(el=>{
    const k = el.dataset.k;
    if(el.type==='checkbox'){ if(el.checked) extra[k]=true; }
    else if(el.value!=='') extra[k]=parseFloat(el.value);
  });
  if(ultimoLatlngs) analisarParcela(ultimoLatlngs, extra);
}

function render(d, fichaHref, comForm){
  const efet = d.condicionantes_efetivas||[], mun = d.condicionantes_ambito_municipal||[];
  const warnKeys = ["patrim","imóveis classificados","hídric","domínio público","servidão","non aedificandi"];
  const isWarn = c => warnKeys.some(k => (c.camada||"").toLowerCase().includes(k));
  const slug = d.categoria_slug;
  const badge = d.regras_implementadas
    ? `<span class="badge ok">regras: ${slug}</span>`
    : slug
      ? `<span class="badge no">categoria reconhecida — regras por implementar</span>`
      : `<span class="badge no">fora do solo qualificado — carece de análise</span>`;
  let h = `<div class="k">Categoria de solo</div>
    <div class="cat">${d.categoria||"—"}</div>
    <div class="cod">${d.categoria_cod||""}${d.operativa? " · "+d.operativa:""}</div>${badge}`;

  if(d.parcela_metricas){
    const m = d.parcela_metricas;
    h += `<div class="sec"><div class="k">Parcela</div><div class="mono" style="font-size:13px">
      ${fmt(m.area_m2)} m² · frente ${fmt(m.frente_m)} m · prof. ${fmt(m.profundidade_m)} m</div></div>`;
  }
  if(d.regime){
    h += `<div class="sec"><div class="k">Regime de edificabilidade</div>
      <div class="cond warn"><div class="l">${d.regime.edificavel}</div>
      <div class="d">${d.regime.sintese}</div></div></div>`;
  } else if(d.capacidade){
    const c = d.capacidade;
    const abc = c.abc_min_m2===c.abc_max_m2 ? `${c.abc_min_m2} m²` : `${c.abc_min_m2}–${c.abc_max_m2} m²`;
    const spec = [];
    if(c.indice_edificacao!=null) spec.push(`índice ${c.indice_edificacao}`);
    if(c.cercea_m!=null) spec.push(`cércea ${fmt(c.cercea_m)} m`);
    if(c.pisos!=null) spec.push(`${c.pisos} pisos`);
    if(c.implantacao_m2!=null) spec.push(`implantação ${fmt(c.implantacao_m2)} m²`);
    h += `<div class="sec"><div class="k">Capacidade estimada</div>
      <div class="abc">${abc}<span class="u"> ABC</span></div>
      <div class="spec mono">${spec.join(" · ")}</div>`;
    if(c.apreciacao_patrimonial) h += `<div class="cond warn" style="margin-top:10px">
      <div class="l">Apreciação patrimonial obrigatória</div>
      <div class="d">Valores são referência máxima — cércea, volumetria e demolição podem ser condicionadas.</div></div>`;
    h += `</div>`;
  } else if(d.estado && d.estado!=="ok"){
    h += `<div class="sec"><div class="muted">${d.estado}</div></div>`;
  }

  h += `<div class="sec"><div class="k">Condicionantes</div>`;
  if(efet.length){
    h += efet.map(c=>`<div class="cond ${isWarn(c)?"warn":""}"><div class="l">${c.camada}</div>
      ${c.designacao?`<div class="d">${c.designacao}</div>`:""}</div>`).join("");
  } else { h += `<div class="muted">Sem servidões ou restrições no ponto.</div>`; }
  if(mun.length) h += `<div class="mun">Âmbito municipal: ${mun.map(c=>c.camada).join("; ")}</div>`;
  h += `</div>`;
  if(d.capacidade || d.regime)
    h += `<a class="ficha-btn" target="_blank" href="${fichaHref}">Abrir ficha ↗</a>`;
  if(comForm) h += formHTML(d.categoria_slug);
  res().innerHTML = h;
  const f = document.getElementById("fx-form");
  if(f) f.addEventListener("change", aplicarExtra);
}
</script>
</body>
</html>
