# Blueprint do Render — deploy do RAIO por container.
# Render define $PORT automaticamente; a app lê-o. RAIO_HOST=0.0.0.0 já vem no Dockerfile.
services:
  - type: web
    name: raio
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: virginia           # US-East. Frankfurt foi bloqueado pelo geoserver da CMP
                               # (500 ao IP do Render). IP dos EUA é aceite. Custo: +latência
                               # nas chamadas à CMP (atravessa o Atlântico). Rever se for lento.
    plan: starter              # ~7 USD/mês (não adormece). "free" existe mas dorme e tem menos RAM.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: RAIO_HOST
        value: 0.0.0.0
      # opcional: - key: RAIO_OVERTURE_REL
      #             value: 2026-07-22.0
