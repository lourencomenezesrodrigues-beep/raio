<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16161A; --vermelhao:#F03C2E; --paper:#F7F6F3;
    --line:rgba(22,22,26,.16); --line-strong:rgba(22,22,26,.30); --muted:rgba(22,22,26,.60);
    --verm-soft:rgba(240,60,46,.07);
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --archivo:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--mono); font-size:13px; line-height:1.7; padding:32px 20px 72px}
  .sheet{max-width:760px; margin:0 auto; background:var(--paper);
    border:1px solid var(--ink); padding:44px 48px 40px}
  @media (max-width:560px){ .sheet{padding:30px 20px} body{padding:16px 10px 48px} }

  .eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted)}
  h1{font-family:var(--archivo); font-weight:900; font-size:30px; line-height:1.05;
    margin:12px 0 6px; text-transform:uppercase; letter-spacing:-.02em; text-wrap:balance}
  @media (max-width:560px){ h1{font-size:23px} }
  .lede{color:var(--muted); font-size:12px; letter-spacing:.04em; text-transform:uppercase; margin:0}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

  section{animation:rise 520ms var(--ease-out) both}
  section:nth-of-type(1){animation-delay:40ms} section:nth-of-type(2){animation-delay:100ms}
  section:nth-of-type(3){animation-delay:160ms} section:nth-of-type(4){animation-delay:220ms}
  section:nth-of-type(5){animation-delay:280ms}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){section{animation:fade 300ms ease both} @keyframes fade{from{opacity:0}to{opacity:1}}}

  .sec-head{margin:34px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line)}
  .sec-head h2{font-family:var(--mono); font-weight:500; font-size:11px;
    letter-spacing:.16em; text-transform:uppercase; margin:0; color:var(--muted)}

  .meta{display:grid; grid-template-columns:auto 1fr; gap:8px 20px; margin-top:20px}
  .meta dt{font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); align-self:center}
  .meta dd{margin:0; font-size:13px}
  .meta dd .mono{font-size:13px}

  .cond{display:flex; flex-direction:column; gap:16px}
  .cond-item{display:block}
  .row{border:1px solid var(--line); border-left:3px solid var(--line-strong);
    background:var(--paper); padding:11px 14px}
  .row.warn{border-left-color:var(--vermelhao); background:var(--verm-soft)}
  .row .top{display:flex; align-items:center; gap:9px}
  .badge{flex:none; width:17px; height:17px; display:inline-grid; place-items:center;
    font-size:11px; font-weight:700; background:var(--vermelhao); color:#fff; font-family:var(--mono)}
  .row .layer{font-family:var(--archivo); font-weight:600; text-transform:uppercase;
    font-size:12.5px; letter-spacing:.01em}
  .row .desc{color:var(--muted); font-size:12px; margin:4px 0 0; line-height:1.55}
  .row .leg{font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); margin-top:5px}
  .empty{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em}
  .municipal{margin-top:12px}
  .municipal .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted)}
  .municipal ul{margin:6px 0 0; padding-left:16px; color:var(--muted); font-size:12px}

  /* capacidade hero + spec */
  .hero{display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    border:1px solid var(--ink); padding:22px; flex-wrap:wrap}
  .hero .k{font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted)}
  .hero .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:40px;
    line-height:1; font-weight:500; color:var(--ink); letter-spacing:-.02em; margin-top:6px}
  .hero .val .sep{color:var(--vermelhao); font-weight:400; margin:0 6px}
  .hero .val .u{font-size:15px; color:var(--muted); font-weight:400; margin-left:5px}
  .hero .note{text-align:right; color:var(--muted); font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; line-height:1.6; max-width:230px}

  .spec{display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); margin-top:12px}
  .spec .cell{background:var(--paper); padding:14px 16px}
  .spec .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted)}
  .spec .v{font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:22px; font-weight:500; margin-top:6px}
  .spec .v .u{font-size:12px; color:var(--muted); font-weight:400; margin-left:3px}
  @media (max-width:520px){ .spec{grid-template-columns:1fr 1fr} }

  .moda-note{margin-top:14px; font-size:11px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted)}
  .moda-note b{color:var(--ink); font-family:var(--mono)}
  .status{border:1px dashed var(--line-strong); padding:16px 18px; color:var(--muted);
    font-size:12px; letter-spacing:.03em; text-transform:uppercase; line-height:1.7}

  /* regras (chips mono) */
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
  .chip{font-family:var(--mono); font-size:11px; color:var(--ink);
    border:1px solid var(--line-strong); padding:4px 8px; background:var(--paper)}
  .chip.sup{border-color:var(--vermelhao); color:var(--vermelhao)}
  .rgroup{margin-bottom:12px}
  .rgroup .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px}
  .notas{margin:10px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px}
  .notas li{font-size:11.5px; color:var(--muted); padding-left:16px; position:relative; line-height:1.55}
  .notas li::before{content:"—"; position:absolute; left:0; color:var(--vermelhao)}

  /* conclusão */
  .verdict{border:1px solid var(--ink); padding:22px; font-size:14px; line-height:1.7}
  .verdict b{color:var(--ink); font-weight:500}
  .verdict .num{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); font-weight:500}
  .uncert{margin:16px 0 0; padding:12px 0 2px 16px; border-left:2px solid var(--vermelhao);
    color:var(--muted); font-size:11.5px; line-height:1.6}
  .disclaimer{margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

  /* capa */
  .capa{min-height:80vh; display:flex; flex-direction:column; justify-content:space-between;
    padding:8px 4px 4px; border-bottom:1px solid var(--line); margin-bottom:8px}
  .capa-top{display:flex; align-items:flex-start; justify-content:space-between}
  .capa-logo{display:flex; align-items:center; gap:14px}
  .capa-logo svg{width:48px; height:48px; flex:none}
  .capa-logo .wm{font-family:var(--archivo); font-weight:900; font-size:40px;
    letter-spacing:-.03em; line-height:1; text-transform:uppercase}
  .capa-tag{font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); text-align:right; padding-top:8px}
  .capa-mid{padding:8px 0}
  .capa-t{font-family:var(--archivo); font-weight:900; text-transform:uppercase;
    font-size:40px; line-height:1.02; letter-spacing:-.02em; color:var(--ink);
    text-wrap:balance; margin:0 0 16px}
  .capa-sub{color:var(--muted); font-size:12px; letter-spacing:.04em; text-transform:uppercase;
    line-height:1.7; max-width:52ch}
  .capa-ref{margin-top:20px; font-family:var(--mono); font-size:12px;
    color:var(--ink); border-left:2px solid var(--vermelhao); padding-left:12px}
  .capa-ref .k{color:var(--muted)}
  .capa-disc{font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
    max-width:62ch; line-height:1.7; padding-top:14px; border-top:1px solid var(--line)}
  .capa-by{margin-top:14px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .capa-by b{color:var(--ink); font-weight:500}
  @media (max-width:560px){ .capa-t{font-size:28px} .capa-logo .wm{font-size:30px} }

  /* recorte de mapa por condicionante */
  .cond-map{margin-top:10px; height:180px; border:1px solid var(--line-strong);
    position:relative; overflow:hidden; background:#e9e8e4 var(--map-base) center/cover no-repeat}
  .cond-map .over{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; mix-blend-mode:multiply}
  .cond-map .pin{position:absolute; left:50%; top:50%; width:11px; height:11px;
    transform:translate(-50%,-50%); background:var(--vermelhao);
    box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--vermelhao)}
  .cond-map .attr{position:absolute; right:5px; bottom:4px; font-family:var(--mono);
    font-size:9px; color:#2a2a2a; background:rgba(247,246,243,.8); padding:1px 5px}

  .toolbar{max-width:760px; margin:0 auto 12px; display:flex; justify-content:flex-end}
  .btn{font-family:var(--mono); font-weight:500; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--paper); background:var(--ink); border:1px solid var(--ink);
    padding:9px 14px; cursor:pointer; transition:background 160ms var(--ease-out)}
  .btn:hover{background:var(--vermelhao); border-color:var(--vermelhao)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--vermelhao); outline-offset:2px}
  @media print{
    body{background:#fff; padding:0} .toolbar{display:none}
    .sheet{border:none} section{animation:none}
    .capa{min-height:94vh; page-break-after:always; border-bottom:none}
  }
</style>
</head>
<body>
  <div class="toolbar"><button class="btn" onclick="window.print()">Imprimir ficha</button></div>
  <main class="sheet">
    {{CONTENT}}
  </main>
</body>
</html>
