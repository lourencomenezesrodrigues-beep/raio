<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --paper:#eef1f3; --surface:#fcfdfe; --ink:#191d21; --muted:#5d6773;
    --line:#d7dde2; --line-strong:#c2cad1;
    --accent:#1e5a82; --accent-soft:#e6eef4;
    --warn:#8a5a12; --warn-stripe:#c8912b; --warn-bg:#f8f1e0;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
    --font-mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#101316; --surface:#171b1f; --ink:#e7ebee; --muted:#98a1ab;
      --line:#282f36; --line-strong:#3a424a;
      --accent:#71b3dc; --accent-soft:#15303f;
      --warn:#e0b056; --warn-stripe:#c8912b; --warn-bg:#241d0f;
    }
  }
  :root[data-theme="light"] {
    --paper:#eef1f3; --surface:#fcfdfe; --ink:#191d21; --muted:#5d6773;
    --line:#d7dde2; --line-strong:#c2cad1;
    --accent:#1e5a82; --accent-soft:#e6eef4;
    --warn:#8a5a12; --warn-stripe:#c8912b; --warn-bg:#f8f1e0;
  }
  :root[data-theme="dark"] {
    --paper:#101316; --surface:#171b1f; --ink:#e7ebee; --muted:#98a1ab;
    --line:#282f36; --line-strong:#3a424a;
    --accent:#71b3dc; --accent-soft:#15303f;
    --warn:#e0b056; --warn-stripe:#c8912b; --warn-bg:#241d0f;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-sans); font-size:15px; line-height:1.6;
    padding:32px 20px 72px;
  }
  .sheet {
    max-width:760px; margin:0 auto; background:var(--surface);
    border:1px solid var(--line); border-top:2px solid var(--accent);
    padding:44px 48px 40px;
    box-shadow:0 1px 2px rgba(20,30,40,.04), 0 12px 32px -12px rgba(20,30,40,.12);
  }
  @media (max-width:560px){ .sheet{ padding:32px 22px; } body{ padding:16px 10px 48px; } }

  .eyebrow {
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted);
  }
  h1 {
    font-family:var(--font-display); font-weight:600; font-size:30px;
    line-height:1.15; margin:10px 0 4px; text-wrap:balance; letter-spacing:-.01em;
  }
  .lede { color:var(--muted); font-size:14px; margin:0; }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  section { animation:rise 520ms var(--ease-out) both; }
  section:nth-of-type(1){animation-delay:40ms}
  section:nth-of-type(2){animation-delay:100ms}
  section:nth-of-type(3){animation-delay:160ms}
  section:nth-of-type(4){animation-delay:220ms}
  section:nth-of-type(5){animation-delay:280ms}
  @keyframes rise { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion: reduce){ section{ animation:fade 300ms ease both } @keyframes fade{from{opacity:0}to{opacity:1}} }

  .sec-head {
    display:flex; align-items:baseline; gap:12px;
    margin:34px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .sec-head .n { font-family:var(--font-mono); font-size:12px; color:var(--accent); }
  .sec-head h2 {
    font-family:var(--font-sans); font-weight:600; font-size:13px;
    letter-spacing:.1em; text-transform:uppercase; margin:0; color:var(--ink);
  }

  /* meta grid */
  .meta { display:grid; grid-template-columns:auto 1fr; gap:7px 20px; margin-top:20px; }
  .meta dt { font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); align-self:center; }
  .meta dd { margin:0; }
  .meta dd .mono { font-size:13.5px; }

  /* condicionantes */
  .cond { display:flex; flex-direction:column; gap:8px; }
  .row {
    border:1px solid var(--line); border-left:3px solid var(--line-strong);
    background:var(--surface); padding:11px 14px; border-radius:2px;
  }
  .row.warn { border-left-color:var(--warn-stripe); background:var(--warn-bg); }
  .row .top { display:flex; align-items:center; gap:9px; }
  .badge {
    flex:none; width:17px; height:17px; border-radius:50%;
    display:inline-grid; place-items:center; font-size:11px; font-weight:700;
    background:var(--warn-stripe); color:#1a1205; font-family:var(--font-mono);
  }
  .row .layer { font-weight:600; font-size:13.5px; }
  .row .desc { color:var(--muted); font-size:13px; margin:3px 0 0; }
  .row .leg { font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:4px; }
  .empty { color:var(--muted); font-style:italic; font-size:14px; }
  .municipal { margin-top:12px; }
  .municipal .lbl { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); }
  .municipal ul { margin:6px 0 0; padding-left:16px; color:var(--muted); font-size:13px; }

  /* capacidade hero + spec */
  .hero {
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    background:var(--accent-soft); border:1px solid var(--line);
    border-radius:3px; padding:20px 22px; flex-wrap:wrap;
  }
  .hero .k { font-family:var(--font-mono); font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--accent); }
  .hero .val { font-family:var(--font-mono); font-variant-numeric:tabular-nums;
    font-size:38px; line-height:1; font-weight:600; color:var(--ink); letter-spacing:-.02em; }
  .hero .val .sep { color:var(--muted); font-weight:400; margin:0 6px; }
  .hero .val .u { font-size:16px; color:var(--muted); font-weight:400; margin-left:4px; }
  .hero .note { text-align:right; color:var(--muted); font-size:12px; max-width:220px; }

  .spec { display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:3px;
    margin-top:12px; overflow:hidden; }
  .spec .cell { background:var(--surface); padding:14px 16px; }
  .spec .k { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); }
  .spec .v { font-family:var(--font-mono); font-variant-numeric:tabular-nums;
    font-size:22px; font-weight:600; margin-top:5px; }
  .spec .v .u { font-size:13px; color:var(--muted); font-weight:400; margin-left:3px; }
  @media (max-width:520px){ .spec{ grid-template-columns:1fr 1fr; } }

  .moda-note { margin-top:14px; font-size:13px; color:var(--muted); }
  .moda-note b { color:var(--ink); font-family:var(--font-mono); }

  .status {
    border:1px dashed var(--line-strong); border-radius:3px; padding:16px 18px;
    color:var(--muted); font-size:14px; background:var(--surface);
  }

  /* regras */
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .chip {
    font-family:var(--font-mono); font-size:12px; color:var(--ink);
    border:1px solid var(--line-strong); border-radius:2px;
    padding:3px 8px; background:var(--surface);
  }
  .chip.sup { border-color:var(--accent); color:var(--accent); }
  .rgroup { margin-bottom:12px; }
  .rgroup .lbl { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .notas { margin:10px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
  .notas li { font-size:12.5px; color:var(--muted); padding-left:16px; position:relative; }
  .notas li::before { content:"—"; position:absolute; left:0; color:var(--line-strong); }

  /* conclusão */
  .verdict {
    background:var(--surface); border:1px solid var(--line);
    border-radius:3px; padding:20px 22px; font-size:15.5px; line-height:1.65;
  }
  .verdict b { color:var(--ink); }
  .verdict .num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--accent); font-weight:600; }
  .uncert {
    margin:16px 0 0; padding:12px 0 2px 16px; border-left:2px solid var(--accent);
    color:var(--muted); font-size:13px; font-style:italic;
  }
  .disclaimer { margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
    font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; color:var(--muted); }

  .toolbar { max-width:760px; margin:0 auto 12px; display:flex; justify-content:flex-end; }
  .btn {
    font-family:var(--font-mono); font-size:12px; letter-spacing:.04em;
    color:var(--muted); background:transparent; border:1px solid var(--line-strong);
    border-radius:2px; padding:6px 12px; cursor:pointer;
    transition:transform 140ms var(--ease-out), color 140ms ease, border-color 140ms ease;
  }
  .btn:hover { color:var(--ink); border-color:var(--ink); }
  .btn:active { transform:scale(0.97); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media print {
    body{ background:#fff; padding:0; } .toolbar{ display:none; }
    .sheet{ box-shadow:none; border:none; } section{ animation:none; }
  }
</style>
</head>
<body>
  <div class="toolbar"><button class="btn" onclick="window.print()">Imprimir ficha</button></div>
  <main class="sheet">
    {{CONTENT}}
  </main>
</body>
</html>
